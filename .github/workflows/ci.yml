name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel any in-progress run for the same ref so duplicate pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Frontend — lint, unit tests, production build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Backend — spin up local Supabase (Docker), apply migrations, run tests
  #
  # Architecture:
  #   supabase start  →  apply-migrations.js  →  vitest  →  runner destroyed
  #
  # The local Supabase CLI uses well-known static credentials (localhost only).
  # These keys are NOT secrets — they only work on 127.0.0.1 and are the same
  # for every local Supabase instance everywhere.
  # See: https://supabase.com/docs/guides/getting-started/local-development
  # ---------------------------------------------------------------------------
  backend:
    name: Backend — integration tests
    runs-on: ubuntu-latest

    env:
      # ── Local Supabase static credentials (safe to commit, localhost only) ──
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hj04zWl196z2-SBc0
      SUPABASE_TEST_DB_URI: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # ── Only real secret needed ──
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d

      # ── Runtime flags ──
      NODE_ENV: test
      # Keep false so tests can insert and clean up TEST_WO_ prefixed data
      IDBP_FILTER_TEST_DATA: 'false'
      # No Telegram bot available in CI
      TELEGRAM_MODE: 'disabled'

    steps:
      - uses: actions/checkout@v4

      # Install Supabase CLI (Docker images are cached between runs)
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Start the full local Supabase stack (API, Auth, Storage, DB)
      # Studio, inbucket, edge runtime are disabled in supabase/config.toml
      - name: Start local Supabase
        run: supabase start

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Apply all 39 migrations to the fresh local DB
      - name: Apply migrations
        working-directory: backend
        run: npm run migrate

      # Run all 40 Vitest integration tests
      - name: Run integration tests
        working-directory: backend
        run: npm test

      # Runner is destroyed after this — no cleanup step needed
