name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run for the same ref so duplicate pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate — frontend lint (no Docker)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

  # ---------------------------------------------------------------------------
  # Fast gate — backend unit tests (no Docker, ~30s)
  # ---------------------------------------------------------------------------
  backend-unit:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run test:unit

  # ---------------------------------------------------------------------------
  # Fast gate — static contract tests (no Docker; DB contracts added in Phase 2)
  # ---------------------------------------------------------------------------
  backend-contract-static:
    name: Backend — static contracts
    runs-on: ubuntu-latest
    needs: backend-unit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Run static contract tests
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: npm run test:contracts

  # ---------------------------------------------------------------------------
  # Docker gate — Supabase + migrate + regression + milestones
  # Only runs after fast gates pass.
  # ---------------------------------------------------------------------------
  backend-integration:
    name: Backend — integration tests
    runs-on: ubuntu-latest
    needs: backend-contract-static

    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      SUPABASE_TEST_DB_URI: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      NODE_ENV: test
      IDBP_FILTER_TEST_DATA: 'false'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_MODE: 'disabled'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Apply migrations
        working-directory: backend
        run: npm run migrate

      - name: Verify manifests are up to date
        working-directory: backend
        run: |
          npm run generate:manifests
          git diff --exit-code tests/manifests/

      - name: Run DB contract tests
        working-directory: backend
        run: npm run test:contracts:db

      - name: Run integration tests
        working-directory: backend
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # Frontend — lint, unit tests, production build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend — test & build
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Verify build env
        env:
          CI: 'true'
          VITE_API_URL: https://snpolymers.onrender.com/api/v1/auth
        run: npm run verify-build-env

      - run: npm test

      - name: Production build
        env:
          CI: 'true'
          VITE_API_URL: https://snpolymers.onrender.com/api/v1/auth
        run: npm run build
