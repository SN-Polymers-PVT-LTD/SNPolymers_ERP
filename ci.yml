name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # backend:
  #   Deferred pending the test-strategy decision — see Regression_Prevention_Plan.md §C.2.
  #   Add once either:
  #     (a) a dedicated test Supabase project exists and its URL/service-role key
  #         are stored as repo secrets (e.g. SUPABASE_TEST_URL, SUPABASE_TEST_SERVICE_ROLE_KEY), or
  #     (b) backend gets a lint script and the live-DB integration suite is moved
  #         to a separate scheduled workflow instead of running on every PR.
